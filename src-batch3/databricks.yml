# Declarative Automation Bundle configuration, more info here: https://docs.databricks.com/en/dev-tools/bundles/settings.html
bundle:
  name: "src-batch3"

include:
  - resources/*.yml
  - resources/*/*.yml
variables:
  catalog_name:
    description: the catalog to use
  warehouse_id:
    description: warehouseID
targets:
  # The 'dev' target, for development purposes. This target is the default.
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-4ece315f-11d6.cloud.databricks.com
    variables:
      catalog_name: 'resume_batch3'
      warehouse_id: 'a75a7e3705d591fa'

  # The 'prod' target, used for production deployment.
  prod:
    mode: production
    workspace:
      host: https://dbc-4ece315f-11d6.cloud.databricks.com
      # We always use /Users/dpksharma648@gmail.com for all resources to make sure we only have a single copy.
      root_path: /Workspace/Dev/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog_name: 'resume_batch3_prod'
      warehouse_id: 'a75a7e3705d591fa'
    run_as:
      # This runs as dpksharma648@gmail.com in production. We could also use a service principal here,
      # see https://docs.databricks.com/dev-tools/bundles/permissions.html.
      user_name: dpksharma648@gmail.com
