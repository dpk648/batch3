resources:
  jobs:
    End_to_End_pipeline:
      name: "End-to-End-pipeline "
      tasks:
        - task_key: ingestion
          notebook_task:
            notebook_path: ../../src/Ingestion to Staging
            base_parameters:
              catalog_name: resume_batch3
              env: dev
              folder_id: 191P4EfP3w9pm5qzuckKVgUFH0CtFCkPH
            source: WORKSPACE
        - task_key: check_incremental
          depends_on:
            - task_key: ingestion
          condition_task:
            op: EQUAL_TO
            left: "{{tasks.ingestion.values.is_process}}"
            right: "0"
        - task_key: staging_to_silver
          depends_on:
            - task_key: check_incremental
              outcome: "false"
          pipeline_task:
            pipeline_id: 2ad70404-2c53-40c0-9637-1873a5e55e43
            full_refresh: false
        - task_key: gold_layer
          depends_on:
            - task_key: staging_to_silver
          notebook_task:
            notebook_path: ../../src/Gold Layer
            base_parameters:
              catalog_name: resume_batch3
            source: WORKSPACE
        - task_key: vector_search
          depends_on:
            - task_key: gold_layer
          notebook_task:
            notebook_path: ../../src/Gold Layer - Vector Search
            base_parameters:
              catalog_name: resume_batch3
            source: WORKSPACE
        - task_key: dashboard
          depends_on:
            - task_key: vector_search
          dashboard_task:
            subscription: {}
            warehouse_id: a75a7e3705d591fa
            dashboard_id: 01f14eb4557d1e7f9e569cdd7456476c
      queue:
        enabled: true
      parameters:
        - name: catalog_name
          default: resume_batch3
      performance_target: PERFORMANCE_OPTIMIZED
